<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 54px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Animated dynamic pipeline nodes background */
    @keyframes pulsePath {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes nodeGlow {
      0%, 100% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
    }

    .pipeline-line {
      stroke: url(#accent);
      stroke-width: 3;
      stroke-dasharray: 12 8;
      animation: pulsePath 25s linear infinite;
      opacity: 0.4;
    }

    .bg-card {
      animation: floatCard 6s ease-in-out infinite;
    }

    .glow-circle {
      animation: nodeGlow 4s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>

  <!-- Ambient Light Orbs (Background Dynamic Aspect) -->
  <circle cx="200" cy="80" r="180" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="280" r="150" fill="#c084fc" opacity="0.15" filter="url(#glow)"/>

  <!-- Background Dynamic Pipeline Flow (Behind Content) -->
  <path class="pipeline-line" d="M 50 300 Q 300 220 600 300 T 1150 200" fill="none"/>
  <path class="pipeline-line" d="M 100 80 Q 400 160 700 70 T 1100 120" fill="none"/>

  <!-- Dynamic Decorative Pipeline Cards (Background Right Side) -->
  <g class="bg-card" transform="translate(780, 60)">
    <!-- Stage 1: Build -->
    <rect x="0" y="30" width="110" height="75" rx="10" fill="url(#cardBg)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="55" y="62" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600">🔨 BUILD</text>
    <text x="55" y="82" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12">✓ Passed</text>

    <line x1="110" y1="67" x2="140" y2="67" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Stage 2: Test -->
    <rect x="140" y="30" width="110" height="75" rx="10" fill="url(#cardBg)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="195" y="62" text-anchor="middle" fill="#818cf8" font-family="sans-serif" font-size="14" font-weight="600">🧪 TEST</text>
    <text x="195" y="82" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="12">✓ 100% Pass</text>

    <line x1="250" y1="67" x2="280" y2="67" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Stage 3: Deploy -->
    <rect x="280" y="30" width="110" height="75" rx="10" fill="url(#cardBg)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="335" y="62" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="600">🚀 DEPLOY</text>
    <text x="335" y="82" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12">Live v2.6</text>
  </g>

  <!-- Foreground Content (Clear & Unobstructed) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill -->
    <rect x="0" y="70" width="220" height="34" rx="17" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="110" y="92" text-anchor="middle" class="badge-text">⚡ AWESOME DEVOPS LIST</text>

    <!-- Main Title -->
    <text x="0" y="165" class="title">Awesome CI/CD Automation</text>

    <!-- Gradient Line Accent -->
    <rect x="0" y="185" width="520" height="4" rx="2" fill="url(#accent)"/>

    <!-- Subtitle -->
    <text x="0" y="230" class="subtitle">Curated SaaS Platforms, Open-Source Engines &amp; Release Tools</text>

    <!-- Subtext Details -->
    <text x="0" y="270" font-family="sans-serif" font-size="15" fill="#64748b">
      Continuous Integration • Automated Testing • Release Orchestration • GitOps
    </text>
  </g>
</svg>
